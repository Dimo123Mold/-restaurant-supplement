<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оформлення замовлення — Козацька кухня</title>
    <style>
        body {
            background-color: #fffaf0;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #8b0000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #fff8dc;
            padding: 30px;
            border: 2px solid #deb887;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.2);
        }

        h2 {
            color: #8b0000;
            font-size: 26px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #8b0000;
            padding-bottom: 5px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            color: #4b2e0f;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #a0522d;
            margin-bottom: 15px;
            font-size: 16px;
            background-color: #fffaf0;
        }

        h3 {
            font-size: 20px;
            color: #006400;
            margin-top: 20px;
        }

        button {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            align-self: flex-start;
        }

        button:hover {
            background-color: #a52a2a;
        }
    </style>
</head>
<body>
<header>
    <h1>Оформлення замовлення</h1>
</header>

<div class="container">
    <h2>Заповніть козацьку грамоту доставки</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <h3>Сума до оплати: {{ cart.total_price }} грн</h3>

        <button type="submit">✅ Підтвердити замовлення</button>
    </form>
</div>
</body>
</html>
